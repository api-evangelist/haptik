components:
  schemas:
    GetIntegrationExternalV20GetChatHistoryResponse:
      type: object
      properties:
        chat_json:
          type: array
          description: Array of chat messages when response_type=json
        chat_text:
          type: string
          description: Plain text chat when response_type=text
    PostIntegrationExternalV20SendChatToAgentRequest:
      type: object
      properties:
        team_name:
          type: string
          description: Name of the team to which the chat is to be assigned.
        user_name:
          type: string
          description: Identifier for the User provided by Haptik when invoking the Integration API
        business_id:
          type: number
          description: Numeric identifier for the channel where the User is messaging
        countdown:
          type: number
          description: Time in seconds before chat is moved to queue (5‑10 seconds).
        receiver:
          type: string
          description: Athena is Haptik's internal Smart agent chat.
      required:
      - team_name
      - user_name
      - business_id
      - receiver
    PostIntegrationExternalV20SendChatToAgentResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the API was a success or failure
    PostMogamboApiNodesFaqCreateRequest:
      type: object
      properties:
        domain_name:
          type: string
          description: Name of the Domain/Bot
        csv_file:
          type: string
          description: CSV file containing FAQ steps
      required:
      - domain_name
      - csv_file
    PostMogamboApiNodesFaqCreateResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the API was a success or failure
        task_id:
          type: string
          description: Job id for the submitted task
    GetMogamboApiNodesFaqCreateStatusTaskidResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the API was a success or failure
        status:
          type: string
          description: Status of the task (e.g., In Progress, Success, Error/Exception)
    PostV10LogFileFromUserRequest:
      type: object
      properties:
        auth_id:
          type: string
          description: Alphanumeric User identifier from your system
        business_id:
          type: string
          description: Numeric identifier for channel/queue on which the message is to be registered
        message_type:
          type: string
          description: The message type should be 1 for image and 52 for document
        file:
          type: string
          description: Contents of the file (binary). Max file size allowed is 10MB
        message_body:
          type: string
          description: The message body containing the message to be sent to the bot or agent
      required:
      - auth_id
      - business_id
      - message_type
      - file
    PostV10LogFileFromUserResponse:
      type: object
      properties:
        message_id:
          type: integer
          description: Message id generated by Haptik system
        message_body:
          type: string
          description: Message body that was logged in the Haptik system
        created_at:
          type: string
          description: ISO timestamp denoting when the message was created in the Haptik system
        message_type:
          type: integer
          description: The message type should be 1 for image and 52 for document
        file_url:
          type: string
          description: The URL for the uploaded file
    PutV10UserRequest:
      type: object
      properties:
        auth_id:
          type: string
        name:
          type: string
        language_code:
          type: string
        custom_data:
          type: object
          properties:
            <key_1>:
              type: string
            <key_2>:
              type: string
    PostV10UserRequest:
      type: object
      properties:
        auth_id:
          type: string
          description: This is an alphanumeric User identifier from your System
        mobile_no:
          type: string
          description: Mobile no of the user
        email:
          type: string
          description: Email of the user
        name:
          type: string
          description: Name of the user
        language_code:
          type: string
          description: Language identifier for user's preferred language based on ISO 639-1
        custom_data:
          type: object
          description: Flat JSON object with additional user information
      required:
      - auth_id
    PostV10UserResponse:
      type: object
      properties:
        auth_id:
          type: string
